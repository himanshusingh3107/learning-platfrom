{% extends "base.html" %}

{% block content %}
<div class="form-box profile-box">
    <h1>My Profile</h1>

    <p class="profile-stat">User ID: <strong>{{ user.user_code }}</strong></p>

    {% if user.role == "trainer" %}
        <p class="profile-stat">
            <strong>{{ follower_count }}</strong> trainee followers
        </p>
    {% endif %}

    <div class="profile-preview">
        {% if user.profile_photo %}
            <img src="{{ url_for('main.profile_photo', filename=user.profile_photo, v=user.profile_photo) }}" alt="Your profile photo">
        {% else %}
            <span aria-hidden="true">&#128100;</span>
        {% endif %}
    </div>

    <form method="POST" enctype="multipart/form-data">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" value="{{ user.name }}" required>

        <label for="location">Location</label>
        <input id="location" name="location" type="text" value="{{ user.location or '' }}" maxlength="120">

        <label for="interests">Learning interests</label>
        <input id="interests" name="interests" type="text" value="{{ user.interests or '' }}" maxlength="500" placeholder="Python, databases, communication">

        <label for="photo">Profile photo</label>
        <input id="photo" name="photo" type="file" accept=".jpg,.jpeg,.png,.gif,.webp">

        {% if user.profile_photo %}
            <label class="checkbox-label">
                <input name="remove_photo" value="yes" type="checkbox">
                Remove current photo
            </label>
        {% endif %}

        <button type="submit">Save Profile</button>
    </form>
</div>
{% endblock %}
