{% extends "base.html" %}

{% block content %}
<div class="form-box">
    <h1>Upload Learning Material</h1>
    <form method="POST" enctype="multipart/form-data">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <label for="tags">Tags</label>
        <input id="tags" name="tags" type="text" placeholder="Python, loops, beginner">

        <label for="location">Target location (optional)</label>
        <input id="location" name="location" type="text" placeholder="Country or city">

        <label for="course_id">Course (optional - add to course library)</label>
        <select id="course_id" name="course_id">
            <option value="">General Library (No course assigned)</option>
            {% for c in courses %}
            <option value="{{ c.id }}" {% if selected_course_id == c.id %}selected{% endif %}>
                {{ c.title }}
            </option>
            {% endfor %}
        </select>
        <small class="form-hint">Assigning to a course makes this note or lecture available in that course's library.</small>

        <label for="material_type">Material type</label>
        <select id="material_type" name="material_type">
            <option value="note">Course Note (PDF, DOC, PPT, TXT)</option>
            <option value="video">Video Lecture (MP4, WEBM)</option>
        </select>

        <label for="file">File</label>
        <input id="file" name="file" type="file" required>

        <label for="thumbnail">Thumbnail (optional)</label>
        <input id="thumbnail" name="thumbnail" type="file" accept=".jpg,.jpeg,.png,.gif,.webp">
        <small class="form-hint">Add a JPG, PNG, GIF, or WEBP image for the course card.</small>

        <button type="submit">Publish Material</button>
    </form>
</div>
{% endblock %}
