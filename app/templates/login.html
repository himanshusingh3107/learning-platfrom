{% extends "base.html" %}

{% block content %}

<main class="form-page">
<div class="form-box auth-box">
    <p class="eyebrow">Welcome back</p>
    <h1>Log in to LearnSpace</h1>
    <p class="muted">Pick up where you left off.</p>

    <form method="POST">

        <label for="email">Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <a class="text-link" href="#">Forgot password?</a>
    <p class="form-footer">Don't have an account? <a href="{{ url_for('auth.signup') }}">Create one</a></p>

</div>
</main>

{% endblock %}
