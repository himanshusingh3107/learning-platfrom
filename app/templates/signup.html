{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h2>Create Account</h2>

    <form method="POST" enctype="multipart/form-data">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >

        <label>Role</label>

        <select name="role" id="role">

            <option value="trainee">
                Trainee
            </option>

            <option value="trainer">
                Trainer
            </option>

        </select>

        <div id="certificate-field">
            <label>Trainer Certificate</label>
            <input type="file" name="certificate" accept=".pdf,.jpg,.jpeg,.png">
            <small>Required for trainer accounts. An admin will check it before approval.</small>
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

<script>
    const roleSelect = document.getElementById("role");
    const certificateField = document.getElementById("certificate-field");
    const certificateInput = certificateField.querySelector("input");

    function updateCertificateField() {
        const isTrainer = roleSelect.value === "trainer";
        certificateField.hidden = !isTrainer;
        certificateInput.required = isTrainer;
    }

    roleSelect.addEventListener("change", updateCertificateField);
    updateCertificateField();
</script>

{% endblock %}
