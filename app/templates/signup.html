{% extends "base.html" %}

{% block content %}

<main class="form-page">
<div class="form-box auth-box">
    <p class="eyebrow">Start your journey</p>
    <h1>Create your account</h1>
    <p class="muted">One login for every learning role.</p>

    <form method="POST" enctype="multipart/form-data">

        <label for="name">Full name</label>

        <input
            type="text"
            name="name"
            required
        >

        <label for="role">I am joining as</label>

        <select name="role" id="role">

            <option value="trainee">
                Trainee
            </option>

            <option value="trainer">
                Trainer
            </option>

        </select>

        <label for="email">Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >

        <div id="certificate-field">
            <label>Trainer Certificate</label>
            <input type="file" name="certificate" accept=".pdf,.jpg,.jpeg,.png">
            <small>Required for trainer accounts. An admin will check it before approval.</small>
        </div>

        <button type="submit">
            Create Account
        </button>

    </form>

    <p class="form-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
</main>

<script>
    const roleSelect = document.getElementById("role");
    const certificateField = document.getElementById("certificate-field");
    const certificateInput = certificateField.querySelector("input");

    function updateCertificateField() {
        const isTrainer = roleSelect.value === "trainer";
        certificateField.hidden = !isTrainer;
        certificateInput.required = isTrainer;
    }

    roleSelect.addEventListener("change", updateCertificateField);
    updateCertificateField();
</script>

{% endblock %}
