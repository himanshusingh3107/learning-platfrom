{% extends "base.html" %}

{% block content %}

<div class="form-box">

    <h2>Create Account</h2>

    <form method="POST">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            minlength="8"
            required
        >

        <label>Role</label>

        <select name="role" id="role">

            <option value="trainee">
                Trainee
            </option>

            <option value="trainer">
                Trainer
            </option>

        </select>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

{% endblock %}
