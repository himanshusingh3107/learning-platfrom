{% extends "base.html" %}

{% block content %}
<main class="form-page">
    <section class="form-box settings-box">
        <p class="eyebrow">Preferences</p>
        <h1>Settings</h1>
        <p class="muted">Adjust your learning space and account access.</p>

        <div class="setting-row setting-card">
            <div><strong>Appearance</strong><small>Choose the look you prefer.</small></div>
            <div class="theme-switch" role="group" aria-label="Theme selection">
                <button type="button" class="theme-button" data-theme="light">Light</button>
                <button type="button" class="theme-button" data-theme="dark">Dark</button>
            </div>
        </div>

        <div class="setting-row setting-card logout-row">
            <div><strong>Log out</strong><small>End your current session.</small></div>
            <form method="POST" action="{{ url_for('auth.logout') }}">
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </div>
    </section>
</main>
<script>
    const applyTheme = (theme) => {
        document.body.classList.toggle("dark-theme", theme === "dark");
        localStorage.setItem("learnspace-theme", theme);
        document.querySelectorAll(".theme-button").forEach((button) => {
            button.classList.toggle("selected", button.dataset.theme === theme);
        });
    };
    applyTheme(localStorage.getItem("learnspace-theme") || "light");
    document.querySelectorAll(".theme-button").forEach((button) => {
        button.addEventListener("click", () => applyTheme(button.dataset.theme));
    });
</script>
{% endblock %}
